<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUNx</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#eee;font-family:system-ui,Arial}header{position:sticky;top:0;background:#09090ddd;border-bottom:1px solid #25252d;z-index:5}.nav,main{max-width:1100px;margin:auto;padding:14px 18px}.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logo{font-size:30px;font-weight:900;background:linear-gradient(90deg,#fff,#9b7cff,#3de7ff);color:transparent;background-clip:text;cursor:pointer}.search{flex:1;min-width:150px}input,textarea{width:100%;background:#111117;color:#fff;border:1px solid #292932;border-radius:12px;padding:11px;margin:4px 0}button,a.btn{border:0;border-radius:11px;padding:10px 14px;background:#8b5cf6;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.ghost{background:#ffffff0a;border:1px solid #292932}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:25px;align-items:center;padding:45px 0}.hero h1{font-size:clamp(45px,8vw,80px);line-height:.9;letter-spacing:-5px}.grad{background:linear-gradient(90deg,#fff,#9b7cff,#3de7ff);color:transparent;background-clip:text}.muted{color:#999;line-height:1.6}.orb{height:250px;border-radius:28px;background:radial-gradient(circle,#9b7cff55,transparent 45%),linear-gradient(135deg,#171221,#08262d);display:grid;place-items:center}.orb:after{content:"FUNx";font-size:55px;font-weight:900;color:#fff;filter:drop-shadow(0 0 25px #9b7cff)}section{margin:30px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{padding:18px;border:1px solid #292932;border-radius:18px;background:linear-gradient(145deg,#15151b,#0e0e12);cursor:pointer}.card h3{margin:7px 0}.card p{font-size:13px;color:#999}.icon{font-size:30px}.lesson{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid #292932;border-radius:13px;margin:9px 0;background:#111117}.lesson b{flex:1}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:18px;z-index:10}.box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111116;border:1px solid #333;border-radius:20px;padding:22px}.hidden{display:none}.q{padding:14px;border:1px solid #292932;border-radius:13px;margin:12px 0}.q label{display:block;margin:8px}.admin{display:grid;grid-template-columns:1fr 1fr;gap:14px}footer{text-align:center;padding:35px;color:#666;border-top:1px solid #222}.errorbox{margin:20px auto;max-width:700px;padding:20px;border:1px solid #7c3aed;border-radius:16px;background:#15111e}@media(max-width:750px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.admin{grid-template-columns:1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><div id="modal" class="modal hidden"><div class="box"><button class="ghost" onclick="closeM()">✕</button><div id="mc"></div></div></div>
<!-- Use the official Supabase browser CDN build -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://dnnqjehuadfftnwyueml.supabase.co";
const SUPABASE_KEY="sb_publishable_ztG5-ssaYovG30k_B5KXPQ_z4zER2qa";
const $=id=>document.getElementById(id), E=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let S=null;
function M(x){$("mc").innerHTML=x;$("modal").classList.remove("hidden")}function closeM(){$("modal").classList.add("hidden")}
function errorPage(title,msg){$("app").innerHTML=`<main><div class="errorbox"><h2>${E(title)}</h2><p>${E(msg)}</p><p class="muted">Internet connection check karo aur Retry dabao. Agar phir bhi issue ho, is message ka screenshot bhejo.</p><button onclick="location.reload()">Retry</button></div></main>`}
function shell(x){$("app").innerHTML='<header><div class="nav"><div class="logo" onclick="home()">FUNx</div><div class="search"><input id="search" placeholder="Search batches, videos, notes..." oninput="search()"></div><button class="ghost" onclick="home()">Home</button><button class="ghost" onclick="admin()">⚙ Admin</button></div></header><main>'+x+'</main><footer>FUNx • Learn. Practice. Improve. © 2026</footer>'}
async function home(){if(!S){errorPage("FUNx could not start","Supabase library load nahi hui. Internet/CDN check karo.");return}try{
let [b,v,d,n,t]=await Promise.all([S.from("batches").select("*").order("id"),S.from("videos").select("*").order("id"),S.from("dpp").select("*").order("id"),S.from("notes").select("*").order("id"),S.from("tests").select("id,title,description").order("id")]);
if(b.error){shell(`<div class="card"><h2>Database setup required</h2><p class="muted">Supabase SQL Editor mein schema.sql run karo, phir refresh karo.</p><p class="muted">${E(b.error.message)}</p></div>`);return}
shell(`<div class="hero"><div><small>⚡ STUDY • TEST • IMPROVE</small><h1>Learn smarter.<br><span class="grad">Have fun.</span></h1><p class="muted">Welcome ${E(localStorage.FUNX_NAME||"Student")}. Batches, DPPs, tests, notes and permitted educational videos.</p><button onclick="document.querySelector('#b').scrollIntoView({behavior:'smooth'})">Explore FUNx →</button></div><div class="orb"></div></div>
<section id="b"><h2>🔥 Working Batches</h2><p class="muted">Choose your learning path</p><div class="grid">${(b.data||[]).map(x=>`<div class="card" onclick="batch(${x.id})"><div class="icon">${E(x.icon||"📚")}</div><h3>${E(x.title)}</h3><p>${E(x.description||"")}</p></div>`).join("")||"<p>No batches added yet.</p>"}</div></section>
<section><h2>📚 Study Zone</h2><div class="grid"><div class="card" onclick="dppPage()"><div class="icon">📝</div><h3>DPP</h3><p>Daily practice.</p></div><div class="card" onclick="testsPage()"><div class="icon">🧪</div><h3>Tests</h3><p>MCQ + instant score.</p></div><div class="card" onclick="notesPage()"><div class="icon">📖</div><h3>Notes</h3><p>Revision resources.</p></div><div class="card"><div class="icon">📚</div><h3>Courses</h3><p>Open a batch above.</p></div></div></section>
<section><h2>▶️ Video Library</h2><div class="grid">${(v.data||[]).map(x=>`<div class="card" onclick="video('${encodeURIComponent(x.url||"")}','${encodeURIComponent(x.title||"Video")}')"><div class="icon">🎥</div><h3>${E(x.title)}</h3><p>${E(x.source||"")}</p></div>`).join("")||"<p>No videos added yet.</p>"}</div></section>`);
}catch(e){errorPage("FUNx could not load",e.message||String(e))}}
async function batch(id){try{let br=await S.from("batches").select("*").eq("id",id).single(),lr=await S.from("lessons").select("*").eq("batch_id",id).order("id"),b=br.data,l=lr.data;if(!b){errorPage("Batch unavailable",br.error?.message||"Batch not found");return}shell(`<button class="ghost" onclick="home()">← Back</button><section><h1>${E(b.title)}</h1><p class="muted">${E(b.description||"")}</p><h2>Lessons</h2>${(l||[]).map(x=>`<div class="lesson">▶️ <b>${E(x.title)}</b><small>${E(x.duration||"")}</small><button onclick="video('${encodeURIComponent(x.video_url||"")}','${encodeURIComponent(x.title)}')">Play</button></div>`).join("")||"<p>No lessons yet.</p>"}</section>`)}catch(e){errorPage("Couldn't open batch",e.message||String(e))}}
async function dppPage(){let r=await S.from("dpp").select("*").order("id"),d=r.data||[];shell('<button class="ghost" onclick="home()">← Back</button><section><h2>📝 DPP</h2>'+(d.map(x=>`<div class="lesson">📝 <b>${E(x.title)}</b><small>${E(x.info||"")}</small><a class="btn" href="${E(x.url||"#")}" target="_blank" rel="noopener">Open</a></div>`).join("")||"<p>No DPPs added yet.</p>")+'</section>')}
async function notesPage(){let r=await S.from("notes").select("*").order("id"),d=r.data||[];shell('<button class="ghost" onclick="home()">← Back</button><section><h2>📖 Notes</h2>'+(d.map(x=>`<div class="lesson">📖 <b>${E(x.title)}</b><small>${E(x.info||"")}</small><a class="btn" href="${E(x.url||"#")}" target="_blank" rel="noopener">Open</a></div>`).join("")||"<p>No notes added yet.</p>")+'</section>')}
async function testsPage(){let r=await S.from("tests").select("id,title,description").order("id"),d=r.data||[];shell('<button class="ghost" onclick="home()">← Back</button><section><h2>🧪 Tests</h2><div class="grid">'+(d.map(x=>`<div class="card"><h3>${E(x.title)}</h3><p>${E(x.description||"")}</p><button onclick="test(${x.id})">Start</button></div>`).join("")||"<p>No tests added yet.</p>")+'</div></section>')}
async function test(id){let r=await S.from("tests").select("*").eq("id",id).single(),t=r.data;if(!t){M("<p>Test not found.</p>");return}M(`<h2>${E(t.title)}</h2><form>${(t.questions||[]).map((q,i)=>`<div class="q"><b>${i+1}. ${E(q.q)}</b>${(q.o||[]).map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${E(o)}</label>`).join("")}</div>`).join("")}<button type="button" onclick="score(${id})">Submit</button></form><div id="sc"></div>`)}
async function score(id){let r=await S.from("tests").select("questions").eq("id",id).single(),qs=r.data?.questions||[],s=0;qs.forEach((q,i)=>{let x=document.querySelector('input[name="q'+i+'"]:checked');if(x&&+x.value===q.a)s++});$("sc").innerHTML='<div class="card"><b>Score: '+s+'/'+qs.length+'</b></div>'}
function video(u,t){M(`<h2>${E(decodeURIComponent(t))}</h2><p class="muted">Opening the permitted source.</p><a class="btn" href="${E(decodeURIComponent(u))}" target="_blank" rel="noopener">Open Video ↗</a>`)}
async function search(){let el=$("search");if(!el||!S)return;let q=el.value.trim();if(!q){home();return}try{let p="%"+q+"%",r=await Promise.all([S.from("batches").select("*").ilike("title",p),S.from("videos").select("*").ilike("title",p),S.from("dpp").select("*").ilike("title",p),S.from("notes").select("*").ilike("title",p),S.from("tests").select("*").ilike("title",p)]),h=[...(r[0].data||[]).map(x=>`<div class="card" onclick="batch(${x.id})">📚 <h3>${E(x.title)}</h3></div>`),...(r[1].data||[]).map(x=>`<div class="card" onclick="video('${encodeURIComponent(x.url||"")}','${encodeURIComponent(x.title||"Video")}')">🎥 <h3>${E(x.title)}</h3></div>`),...(r[2].data||[]).map(x=>`<div class="card" onclick="dppPage()">📝 <h3>${E(x.title)}</h3></div>`),...(r[3].data||[]).map(x=>`<div class="card" onclick="notesPage()">📖 <h3>${E(x.title)}</h3></div>`),...(r[4].data||[]).map(x=>`<div class="card" onclick="test(${x.id})">🧪 <h3>${E(x.title)}</h3></div>`)].join("");shell('<button class="ghost" onclick="home()">← Home</button><section><h2>Search Results</h2><div class="grid">'+(h||"<p>No results.</p>")+'</div></section>')}catch(e){errorPage("Search failed",e.message||String(e))}}
async function admin(){if(!S){M("<p>Supabase library unavailable. Refresh the page.</p>");return}let r=await S.auth.getUser(),u=r.data?.user;if(!u){M('<h2>🔐 Admin Login</h2><p class="muted">Students do not need login.</p><input id="em" placeholder="Admin email"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button>');return}renderAdmin()}
async function login(){let r=await S.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(r.error){M("<p>"+E(r.error.message)+"</p>");return}closeM();renderAdmin()}
async function renderAdmin(){shell(`<button class="ghost" onclick="home()">← Back</button><section><h1>FUNx Admin</h1><p class="muted">Online content manager.</p><div class="admin">
<div class="card"><h3>➕ Video</h3><input id="vt" placeholder="Title"><input id="vs" placeholder="Source"><input id="vu" placeholder="Permitted URL"><button onclick="add('videos',{title:val('vt'),source:val('vs'),url:val('vu')})">Add</button></div>
<div class="card"><h3>➕ DPP</h3><input id="dt" placeholder="Title"><input id="di" placeholder="Info"><input id="du" placeholder="Permitted PDF URL"><button onclick="add('dpp',{title:val('dt'),info:val('di'),url:val('du')})">Add</button></div>
<div class="card"><h3>➕ Note</h3><input id="nt" placeholder="Title"><input id="ni" placeholder="Info"><input id="nu" placeholder="Permitted PDF URL"><button onclick="add('notes',{title:val('nt'),info:val('ni'),url:val('nu')})">Add</button></div>
<div class="card"><h3>➕ Test</h3><input id="tt" placeholder="Title"><textarea id="tq" placeholder='[{"q":"2+2?","o":["3","4"],"a":1}]'></textarea><button onclick="addTest()">Add</button></div></div><button class="ghost" onclick="S.auth.signOut().then(home)">Logout</button></section>`)}
function val(id){return $(id).value.trim()}
async function add(table,row){let r=await S.from(table).insert(row);if(r.error)M("<p>"+E(r.error.message)+"</p>");else renderAdmin()}
async function addTest(){try{await add("tests",{title:val("tt"),questions:JSON.parse(val("tq"))})}catch(e){M("<p>Invalid JSON</p>")}}
function setName(){let n=val("nm");if(!n)return;localStorage.FUNX_NAME=n;closeM();home()}
function start(){try{if(!window.supabase||typeof window.supabase.createClient!=="function"){errorPage("FUNx couldn't start","Supabase browser library load nahi hui. Internet/CDN check karo; phir Retry dabao.");return}S=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);if(!localStorage.FUNX_NAME)M('<h2>Welcome to FUNx</h2><p class="muted">Enter your name. No login needed.</p><input id="nm" placeholder="Your name"><button onclick="setName()">Enter FUNx</button>');else home()}catch(e){errorPage("FUNx couldn't start",e.message||String(e))}}
start();
</script></body></html>
