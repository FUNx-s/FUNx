<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUNx</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#eee;font-family:system-ui,Arial}header{position:sticky;top:0;background:#09090ddd;backdrop-filter:blur(15px);border-bottom:1px solid #25252d;z-index:5}.nav,main{max-width:1100px;margin:auto;padding:14px 18px}.nav{display:flex;gap:10px;align-items:center}.logo{font-size:30px;font-weight:900;background:linear-gradient(90deg,#fff,#9b7cff,#3de7ff);color:transparent;background-clip:text;cursor:pointer}.search{flex:1}input,textarea{width:100%;background:#111117;color:#fff;border:1px solid #292932;border-radius:12px;padding:11px}button,a.btn{border:0;border-radius:11px;padding:10px 14px;background:#8b5cf6;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.ghost{background:#ffffff0a;border:1px solid #292932}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:25px;align-items:center;padding:45px 0}.hero h1{font-size:clamp(45px,8vw,80px);line-height:.9;letter-spacing:-5px}.grad{background:linear-gradient(90deg,#fff,#9b7cff,#3de7ff);color:transparent;background-clip:text}.muted{color:#999;line-height:1.6}.orb{height:250px;border-radius:28px;background:radial-gradient(circle,#9b7cff55,transparent 45%),linear-gradient(135deg,#171221,#08262d);display:grid;place-items:center}.orb:after{content:"FUNx";font-size:55px;font-weight:900;color:#fff;filter:drop-shadow(0 0 25px #9b7cff)}section{margin:30px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{padding:18px;border:1px solid #292932;border-radius:18px;background:linear-gradient(145deg,#15151b,#0e0e12);transition:.2s}.card:hover{transform:translateY(-3px);border-color:#8b5cf655}.card h3{margin:7px 0}.card p{font-size:13px;color:#999}.icon{font-size:30px}.lesson{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid #292932;border-radius:13px;margin:9px 0;background:#111117}.lesson b{flex:1}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:18px;z-index:10}.box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111116;border:1px solid #333;border-radius:20px;padding:22px}.hidden{display:none}.field{margin:7px 0}.q{padding:14px;border:1px solid #292932;border-radius:13px;margin:12px 0}.q label{display:block;margin:8px}.admin{display:grid;grid-template-columns:1fr 1fr;gap:14px}footer{text-align:center;padding:35px;color:#666;border-top:1px solid #222}@media(max-width:750px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.admin{grid-template-columns:1fr}.search{order:3;flex-basis:100%}.nav{flex-wrap:wrap}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><div id="modal" class="modal hidden"><div class="box"><button class="ghost" onclick="closeM()">✕</button><div id="mc"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://dnnqjehuadfftnwyueml.supabase.co",KEY="sb_publishable_ztG5-ssaYovG30k_B5KXPQ_z4zER2qa",S=supabase.createClient(URL,KEY);
const E=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const M=x=>{mc.innerHTML=x;modal.classList.remove("hidden")},closeM=()=>modal.classList.add("hidden");
function shell(x){app.innerHTML='<header><div class="nav"><div class="logo" onclick="home()">FUNx</div><div class="search"><input id="search" placeholder="Search..." oninput="search()"></div><button class="ghost" onclick="home()">Home</button><button class="ghost" onclick="admin()">⚙</button></div></header><main>'+x+'</main><footer>FUNx • Learn. Practice. Improve. © 2026</footer>'}
async function home(){let [b,v,d,n,t]=await Promise.all([S.from("batches").select("*").order("id"),S.from("videos").select("*").order("id"),S.from("dpp").select("*").order("id"),S.from("notes").select("*").order("id"),S.from("tests").select("id,title,description").order("id")]);if(b.error){shell('<div class="card"><h2>Database setup required</h2><p class="muted">Run schema.sql in Supabase SQL Editor, then refresh.</p></div>');return}
shell(`<div class="hero"><div><small>⚡ STUDY • TEST • IMPROVE</small><h1>Learn smarter.<br><span class="grad">Have fun.</span></h1><p class="muted">Welcome ${E(localStorage.FUNX_NAME||"Student")}. Courses, batches, DPPs, tests, notes and permitted educational videos.</p><button onclick="document.querySelector('#b').scrollIntoView({behavior:'smooth'})">Explore FUNx →</button></div><div class="orb"></div></div>
<section id="b"><h2>🔥 Working Batches</h2><p class="muted">Choose your learning path</p><div class="grid">${(b.data||[]).map(x=>`<div class="card" onclick="batch(${x.id})"><div class="icon">${E(x.icon||"📚")}</div><h3>${E(x.title)}</h3><p>${E(x.description||"")}</p></div>`).join("")}</div></section>
<section><h2>📚 Study Zone</h2><div class="grid"><div class="card" onclick="dppPage()"><div class="icon">📝</div><h3>DPP</h3><p>Daily practice.</p></div><div class="card" onclick="testsPage()"><div class="icon">🧪</div><h3>Tests</h3><p>MCQ + instant score.</p></div><div class="card" onclick="notesPage()"><div class="icon">📖</div><h3>Notes</h3><p>Revision resources.</p></div><div class="card"><div class="icon">📚</div><h3>Courses</h3><p>Open a batch above.</p></div></div></section>
<section><h2>▶️ Video Library</h2><div class="grid">${(v.data||[]).map(x=>`<div class="card" onclick="video('${encodeURIComponent(x.url)}','${encodeURIComponent(x.title)}')"><div class="icon">🎥</div><h3>${E(x.title)}</h3><p>${E(x.source||"")}</p></div>`).join("")}</div></section>`) }
async function batch(id){let b=(await S.from("batches").select("*").eq("id",id).single()).data,l=(await S.from("lessons").select("*").eq("batch_id",id).order("id")).data;shell(`<button class="ghost" onclick="home()">← Back</button><section><h1 style="font-size:50px;letter-spacing:-3px">${E(b.title)}</h1><p class="muted">${E(b.description||"")}</p><h2>Lessons</h2>${(l||[]).map(x=>`<div class="lesson">▶️ <b>${E(x.title)}</b><small>${E(x.duration||"")}</small><button onclick="video('${encodeURIComponent(x.video_url||"")}','${encodeURIComponent(x.title)}')">Play</button></div>`).join("")||'<p class="muted">No lessons yet.</p>'}</section>`)}
async function dppPage(){let d=(await S.from("dpp").select("*").order("id")).data;shell('<button class="ghost" onclick="home()">← Back</button><section><h2>📝 DPP</h2>'+(d||[]).map(x=>`<div class="lesson">📝 <b>${E(x.title)}</b><small>${E(x.info||"")}</small><a class="btn" href="${E(x.url||"#")}" target="_blank">Open</a></div>`).join("")+'</section>')}
async function notesPage(){let d=(await S.from("notes").select("*").order("id")).data;shell('<button class="ghost" onclick="home()">← Back</button><section><h2>📖 Notes</h2>'+(d||[]).map(x=>`<div class="lesson">📖 <b>${E(x.title)}</b><small>${E(x.info||"")}</small><a class="btn" href="${E(x.url||"#")}" target="_blank">Open</a></div>`).join("")+'</section>')}
async function testsPage(){let d=(await S.from("tests").select("id,title,description").order("id")).data;shell('<button class="ghost" onclick="home()">← Back</button><section><h2>🧪 Tests</h2><div class="grid">'+(d||[]).map(x=>`<div class="card"><h3>${E(x.title)}</h3><p>${E(x.description||"")}</p><button onclick="test(${x.id})">Start</button></div>`).join("")+'</div></section>')}
async function test(id){let t=(await S.from("tests").select("*").eq("id",id).single()).data;M(`<h2>${E(t.title)}</h2><form id="tf">${(t.questions||[]).map((q,i)=>`<div class="q"><b>${i+1}. ${E(q.q)}</b>${q.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${E(o)}</label>`).join("")}</div>`).join("")}<button type="button" onclick="score(${id})">Submit</button></form><div id="sc"></div>`)}
async function score(id){let t=(await S.from("tests").select("questions").eq("id",id).single()).data,s=0;t.questions.forEach((q,i)=>{let x=document.querySelector('input[name=q'+i+']:checked');if(x&&+x.value===q.a)s++});sc.innerHTML='<div class="card"><b>Score: '+s+'/'+t.questions.length+'</b></div>'}
function video(u,t){M(`<h2>${E(decodeURIComponent(t))}</h2><p class="muted">Opening the official/permitted source.</p><a class="btn" href="${E(decodeURIComponent(u))}" target="_blank">Open Video ↗</a>`)}
async function search(){let q=document.getElementById("search").value.trim();if(!q)return home();let p="%"+q+"%",r=await Promise.all([S.from("batches").select("*").ilike("title",p),S.from("videos").select("*").ilike("title",p),S.from("dpp").select("*").ilike("title",p),S.from("notes").select("*").ilike("title",p),S.from("tests").select("*").ilike("title",p)]);let h=[...(r[0].data||[]).map(x=>`<div class="card" onclick="batch(${x.id})">📚 <h3>${E(x.title)}</h3></div>`),...(r[1].data||[]).map(x=>`<div class="card" onclick="video('${encodeURIComponent(x.url)}','${encodeURIComponent(x.title)}')">🎥 <h3>${E(x.title)}</h3></div>`),...(r[2].data||[]).map(x=>`<div class="card" onclick="dppPage()">📝 <h3>${E(x.title)}</h3></div>`),...(r[3].data||[]).map(x=>`<div class="card" onclick="notesPage()">📖 <h3>${E(x.title)}</h3></div>`),...(r[4].data||[]).map(x=>`<div class="card" onclick="test(${x.id})">🧪 <h3>${E(x.title)}</h3></div>`)].join("");shell('<button class="ghost" onclick="home()">← Home</button><section><h2>Search Results</h2><div class="grid">'+(h||"<p class='muted'>No results.</p>")+'</div></section>')}
async function admin(){let u=(await S.auth.getUser()).data.user;if(!u){M('<h2>🔐 Admin Login</h2><p class="muted">Students do not need login.</p><input id="em" placeholder="Admin email"><input id="pw" type="password" placeholder="Password" style="margin-top:8px"><button onclick="login()">Login</button>');return}renderAdmin()}
async function login(){let r=await S.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(r.error)return M('<p>'+E(r.error.message)+'</p>');closeM();renderAdmin()}
async function renderAdmin(){shell(`<button class="ghost" onclick="home()">← Back</button><section><h1 style="font-size:50px;letter-spacing:-3px">FUNx Admin</h1><p class="muted">Online content manager. Changes appear for all users.</p><div class="admin">
<div class="card"><h3>➕ Video</h3><input id="vt" placeholder="Title"><input id="vs" placeholder="Source" style="margin-top:7px"><input id="vu" placeholder="Official/permitted URL" style="margin-top:7px"><button onclick="add('videos',{title:val('vt'),source:val('vs'),url:val('vu')})">Add</button></div>
<div class="card"><h3>➕ DPP</h3><input id="dt" placeholder="Title"><input id="di" placeholder="Info" style="margin-top:7px"><input id="du" placeholder="Permitted PDF URL" style="margin-top:7px"><button onclick="add('dpp',{title:val('dt'),info:val('di'),url:val('du')})">Add</button></div>
<div class="card"><h3>➕ Note</h3><input id="nt" placeholder="Title"><input id="ni" placeholder="Info" style="margin-top:7px"><input id="nu" placeholder="Permitted PDF URL" style="margin-top:7px"><button onclick="add('notes',{title:val('nt'),info:val('ni'),url:val('nu')})">Add</button></div>
<div class="card"><h3>➕ Test</h3><input id="tt" placeholder="Title"><textarea id="tq" placeholder='[{"q":"2+2?","o":["3","4"],"a":1}' style="margin-top:7px"></textarea><button onclick="addTest()">Add</button></div></div><button class="ghost" onclick="S.auth.signOut().then(home)">Logout</button></section>`)}
function val(id){return document.getElementById(id).value.trim()}async function add(table,row){let r=await S.from(table).insert(row);if(r.error)M('<p>'+E(r.error.message)+'</p>');else renderAdmin()}
async function addTest(){try{await add("tests",{title:val("tt"),questions:JSON.parse(val("tq"))})}catch(e){M("<p>Invalid JSON</p>")}}
if(!localStorage.FUNX_NAME)M('<h2>Welcome to FUNx</h2><p class="muted">Enter your name. No login needed.</p><input id="nm" placeholder="Your name"><button onclick="setName()">Enter FUNx</button>');else home();
function setName(){let n=val("nm");if(!n)return;localStorage.FUNX_NAME=n;closeM();home()}
</script></body></html>
